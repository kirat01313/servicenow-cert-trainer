</main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="menu-pop" id="certPop" role="menu" hidden></div>
<div class="menu-pop" id="userPop" role="menu" hidden></div>
<dialog class="dlg" id="dlg"></dialog>

<script>window.CSA_WEB = 1;</script>
